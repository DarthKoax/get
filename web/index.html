<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-mode" content="auto">
  <title>GET URL Shortcuts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading" class="loading-overlay">
    <svg class="pixel-spinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <path class="spinner-frame spinner-frame-1" d="M4 12H2L2 6H4V12ZM6 6H4V4H6V6ZM12 4L6 4V2L12 2V4Z"/>
      <path class="spinner-frame spinner-frame-2" d="M18 22H6V20H18V22ZM6 20H4V18H6V20ZM20 20H18V18H20V20ZM4 18H2L2 6H4L4 18ZM22 18H20V12H22V18ZM6 6H4V4H6V6ZM12 4H6V2L12 2V4Z"/>
      <path class="spinner-frame spinner-frame-3" d="M18 22H6V20H18V22ZM6 20H4V18H6V20ZM20 20H18V18H20V20ZM4 18H2L2 12H4L4 18ZM22 18H20V6H22V18ZM9 14.998H11V16.998H9V15H7L7 9H9V14.998ZM15 8.99805H17V10.998H15V9H9V7L15 7V8.99805ZM20 6H18V4H20V6ZM18 4L12 4V2L18 2V4Z"/>
      <path class="spinner-frame spinner-frame-4" d="M10 22H6V20H10V22ZM16 22H12V20H16V22ZM6 20H4V18H6V20ZM20 20H18V18H20V20ZM4 18H2V6H4V18ZM22 16H20V12H22V16ZM22 10H20V6H22V10ZM6 6H4V4H6V6ZM20 6H18V4H20V6ZM18 4H6V2H18V4Z"/>
      <path class="spinner-frame spinner-frame-5" d="M14 23H10V19H14V23ZM7 21H3L3 17H7V21ZM21 20H18V17H21V20ZM6 9V14H1L1 9H6ZM23 13H20V10H23V13ZM3 11V12H4V11H3ZM13 7H7L7 1L13 1V7ZM20 6H18V4L20 4V6ZM9 5H11V3H9V5Z"/>
    </svg>
  </div>
  
  <main>
    <header class="main-header">
      <h1>GET URL Shortcuts <span id="mode-badge" class="mode-badge"></span></h1>
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Toggle menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
          <rect x="3" y="6" width="18" height="2" fill="currentColor"/>
          <rect x="3" y="11" width="18" height="2" fill="currentColor"/>
          <rect x="3" y="16" width="18" height="2" fill="currentColor"/>
        </svg>
      </button>
    </header>

    <nav id="menu-panel" class="menu-panel">
      <section id="add-section">
        <h2>Add Shortcut</h2>
        <form id="add-form">
          <div class="form-row">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="gh" disabled required aria-label="Shortcut name" pattern="^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" title="Lowercase letters, numbers, and hyphens only. Cannot start or end with a hyphen." />
          </div>
          <div class="form-row">
            <label for="url">URL</label>
            <input id="url" type="text" placeholder="https://github.com or chrome://settings" disabled required aria-label="Shortcut URL" />
          </div>
          <div class="form-row">
            <label for="search-url">Search URL <small>(optional, for search shortcuts)</small></label>
            <input id="search-url" type="text" placeholder="https://www.google.com/search?q=" disabled aria-label="Search URL template" />
          </div>
          <div class="form-row">
            <label for="description">Description</label>
            <input id="description" type="text" placeholder="GitHub" disabled aria-label="Shortcut description" />
          </div>
          <button id="add-btn" type="submit" disabled>
            <svg width="12" height="12" viewBox="0 0 12 12" style="vertical-align: middle; margin-right: 4px;">
              <rect x="5" y="0" width="2" height="12" fill="currentColor"/>
              <rect x="0" y="5" width="12" height="2" fill="currentColor"/>
            </svg>
            Add
          </button>
        </form>
      </section>

      <section id="download-section">
        <button id="download-btn" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 4px;">
            <rect x="6" y="0" width="4" height="8" fill="currentColor"/>
            <polygon points="4,8 8,12 12,8" fill="currentColor"/>
            <rect x="2" y="14" width="12" height="2" fill="currentColor"/>
          </svg>
          Download Database
        </button>
      </section>
    </nav>

    <section id="resolve-section" class="resolve-box">
      <label for="resolve-input">
        <svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 4px;">
          <rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2"/>
          <rect x="10" y="10" width="4" height="4" fill="currentColor"/>
        </svg>
        Resolve
      </label>
      <input id="resolve-input" type="text" placeholder="Type shortcut name..." disabled aria-label="Shortcut name to resolve" />
      <button id="resolve-btn" type="button" disabled>
        <svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align: middle; margin-right: 4px;">
          <polygon points="4,2 12,8 4,14" fill="currentColor"/>
        </svg>
        Go
      </button>
    </section>

    <section id="filter-section">
      <label for="filter-input">
        <svg width="12" height="12" viewBox="0 0 12 12" style="vertical-align: middle; margin-right: 4px;">
          <rect x="1" y="1" width="10" height="2" fill="currentColor"/>
          <rect x="3" y="5" width="6" height="2" fill="currentColor"/>
          <rect x="5" y="9" width="2" height="2" fill="currentColor"/>
        </svg>
        Filter
      </label>
      <input id="filter-input" type="text" placeholder="Filter shortcuts..." disabled aria-label="Filter shortcuts" />
    </section>

    <section id="shortcuts-list" aria-label="Shortcuts list"></section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="wasm_exec.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
