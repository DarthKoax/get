server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.wasm$ {
        types {}
        default_type application/wasm;
    }

    location ~* \.js$ {
        types {}
        default_type application/javascript;
    }
}
